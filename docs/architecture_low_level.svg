<svg viewBox="0 0 1000 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five techniques differ only in how they generate candidate segments. Every candidate then passes through the same evaluation, filtering, deduplication, scoring, and ranking pipeline, so differences in the final output come from the technique's discovery method, not inconsistent metric implementations.">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .box { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:8; }
    .accent { fill:#ecfdf5; stroke:#16a34a; stroke-width:2; rx:8; }
    .title { font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; fill:#0f172a; }
    .titleAccent { font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; fill:#14532d; }
    .sub { font-family:Arial,Helvetica,sans-serif; font-size:11px; fill:#334155; }
    .small { font-family:Arial,Helvetica,sans-serif; font-size:10.5px; font-weight:700; fill:#0f172a; }
    .edge { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arrow3); }
    .h1 { font-family:Arial,Helvetica,sans-serif; font-size:19px; font-weight:700; fill:#0f172a; }
    .h2 { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#475569; }
  </style>

  <text x="500" y="28" text-anchor="middle" class="h1">Low-Level Pipeline — One Contract After Discovery</text>
  <text x="500" y="47" text-anchor="middle" class="h2">Techniques differ only in how they find candidates. Everything after is identical code, for all five.</text>

  <rect class="box" x="350" y="66" width="300" height="46"/>
  <text x="500" y="94" text-anchor="middle" class="title">Development + Monitoring Data</text>

  <path class="edge" d="M500,112 L500,132"/>
  <rect class="box" x="330" y="134" width="340" height="60"/>
  <text x="500" y="157" text-anchor="middle" class="title">Feature Schema Guard</text>
  <text x="500" y="176" text-anchor="middle" class="sub">keeps age/income/region/occupation, excludes target/score/ead/shap_*</text>

  <path class="edge" d="M500,194 L500,212"/>

  <!-- 5 technique boxes: candidate generation only -->
  <rect class="box" x="45" y="214" width="170" height="66"/>
  <text x="130" y="240" text-anchor="middle" class="small">AutoSlicer</text>
  <text x="130" y="256" text-anchor="middle" class="sub">beam search</text>

  <rect class="box" x="225" y="214" width="170" height="66"/>
  <text x="310" y="240" text-anchor="middle" class="small">Feature Binning</text>
  <text x="310" y="256" text-anchor="middle" class="sub">per-feature bins</text>

  <rect class="box" x="405" y="214" width="170" height="66"/>
  <text x="490" y="240" text-anchor="middle" class="small">Decision Tree</text>
  <text x="490" y="256" text-anchor="middle" class="sub">GBDT leaves</text>

  <rect class="box" x="585" y="214" width="170" height="66"/>
  <text x="670" y="240" text-anchor="middle" class="small">Clustering</text>
  <text x="670" y="256" text-anchor="middle" class="sub">K-Means</text>

  <rect class="box" x="765" y="214" width="190" height="66"/>
  <text x="860" y="240" text-anchor="middle" class="small">Drift Localization</text>
  <text x="860" y="256" text-anchor="middle" class="sub">dev-vs-mon tree</text>

  <text x="500" y="298" text-anchor="middle" class="sub" font-style="italic">each returns: segment rule + dev_mask + mon_mask</text>

  <path class="edge" d="M130,280 L130,300 L500,300 L500,318"/>
  <path class="edge" d="M310,280 L310,300 L500,300 L500,318"/>
  <path class="edge" d="M490,280 L500,318"/>
  <path class="edge" d="M670,280 L670,300 L500,300 L500,318"/>
  <path class="edge" d="M860,280 L860,300 L500,300 L500,318"/>

  <rect class="box" x="290" y="320" width="420" height="56"/>
  <text x="500" y="353" text-anchor="middle" class="title">Common Candidate Contract</text>

  <path class="edge" d="M500,376 L500,394"/>
  <rect class="box" x="230" y="396" width="540" height="94"/>
  <text x="500" y="420" text-anchor="middle" class="title">Common Evaluation</text>
  <text x="500" y="440" text-anchor="middle" class="sub">Population % · Exposure % · AUC · Gini · KS · Bad Rate</text>
  <text x="500" y="456" text-anchor="middle" class="sub">Calibration · PSI · SHAP Shift · Feature Drift</text>
  <text x="500" y="476" text-anchor="middle" class="sub" font-style="italic">same formulas, same code, every technique</text>

  <path class="edge" d="M500,490 L500,508"/>
  <rect class="box" x="290" y="510" width="420" height="56"/>
  <text x="500" y="543" text-anchor="middle" class="title">Common Filtering + Deduplication</text>

  <path class="edge" d="M500,566 L500,584"/>
  <rect class="box" x="270" y="586" width="460" height="94"/>
  <text x="500" y="610" text-anchor="middle" class="title">Common Scoring</text>
  <text x="500" y="632" text-anchor="middle" class="sub">SIS · DIS · Root Cause Score</text>
  <text x="500" y="650" text-anchor="middle" class="sub" font-weight="700">Severity Score (technique-local ranking)</text>
  <text x="500" y="668" text-anchor="middle" class="sub" font-style="italic">same weighted formula, every technique</text>

  <path class="edge" d="M500,680 L500,698"/>
  <rect class="box" x="350" y="700" width="300" height="54"/>
  <text x="500" y="732" text-anchor="middle" class="title">Technique Top-N</text>

  <path class="edge" d="M500,754 L500,772"/>
  <rect class="accent" x="330" y="774" width="340" height="66"/>
  <text x="500" y="800" text-anchor="middle" class="titleAccent">Cross-Technique Ranking</text>
  <text x="500" y="820" text-anchor="middle" class="sub">by Root Cause Score, not raw Severity Score</text>

  <text x="500" y="870" text-anchor="middle" class="sub" font-style="italic">Severity Score ranks within one technique's own pool; Root Cause</text>
  <text x="500" y="886" text-anchor="middle" class="sub" font-style="italic">Score is normalized the same way for every technique, so only it</text>
  <text x="500" y="902" text-anchor="middle" class="sub" font-style="italic">is safe to compare across techniques.</text>
</svg>
