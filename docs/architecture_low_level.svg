<svg viewBox="0 0 1680 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Each technique independently generates, filters, evaluates, deduplicates and scores candidate segments; the five technique-level top-10 lists are then pooled and re-ranked by normalized Root Cause Score, not by raw Severity Score, because Severity Score is on a different scale per technique.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <style>
    .box { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:8; }
    .accent { fill:#ecfdf5; stroke:#16a34a; stroke-width:2; rx:8; }
    .warn { fill:#fef2f2; stroke:#b91c1c; stroke-width:1.5; stroke-dasharray:5,4; rx:8; }
    .title { font-family:Arial,Helvetica,sans-serif; font-size:13px; font-weight:700; fill:#0f172a; }
    .titleAccent { font-family:Arial,Helvetica,sans-serif; font-size:13.5px; font-weight:700; fill:#14532d; }
    .sub { font-family:Arial,Helvetica,sans-serif; font-size:10.5px; fill:#334155; }
    .warnText { font-family:Arial,Helvetica,sans-serif; font-size:10.5px; fill:#7f1d1d; }
    .edge { stroke:#334155; stroke-width:1.5; fill:none; marker-end:url(#arrow2); }
    .edgelabel { font-family:Arial,Helvetica,sans-serif; font-size:10px; fill:#475569; }
    .h1 { font-family:Arial,Helvetica,sans-serif; font-size:19px; font-weight:700; fill:#0f172a; }
    .h2 { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#475569; }
    .band { font-family:Arial,Helvetica,sans-serif; font-size:11px; font-weight:700; fill:#475569; }
  </style>

  <text x="840" y="26" text-anchor="middle" class="h1">Low-Level Pipeline — From Raw Candidate to Ranked Root Cause</text>
  <text x="840" y="45" text-anchor="middle" class="h2">Every technique runs the same six-step evaluation contract; only the final cross-technique step needs a metric that is actually comparable between techniques.</text>

  <!-- Band A bounding box -->
  <rect x="25" y="86" width="1320" height="150" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" rx="10"/>
  <text x="45" y="78" class="band">RUNS INDEPENDENTLY FOR EACH OF THE 5 TECHNIQUES</text>

  <!-- Band A boxes -->
  <rect class="box" x="40" y="108" width="190" height="104"/>
  <text x="135" y="130" text-anchor="middle" class="title">1. Candidate Generation</text>
  <text x="135" y="150" text-anchor="middle" class="sub">beam search / bins /</text>
  <text x="135" y="163" text-anchor="middle" class="sub">tree leaves / clusters</text>
  <text x="135" y="182" text-anchor="middle" class="sub" font-style="italic">→ dev_mask, mon_mask</text>

  <rect class="box" x="260" y="108" width="190" height="104"/>
  <text x="355" y="130" text-anchor="middle" class="title">2. Size Filter</text>
  <text x="355" y="150" text-anchor="middle" class="sub">min segment size</text>
  <text x="355" y="163" text-anchor="middle" class="sub">≤ 35% of population</text>
  <text x="355" y="182" text-anchor="middle" class="sub" font-style="italic">(max_segment_pct, both sides)</text>

  <rect class="box" x="480" y="108" width="190" height="104"/>
  <text x="575" y="130" text-anchor="middle" class="title">3. Per-Segment Evaluation</text>
  <text x="575" y="150" text-anchor="middle" class="sub">dev_sub vs mon_sub</text>
  <text x="575" y="163" text-anchor="middle" class="sub">PSI · ΔAUC/Gini/KS · ΔBR</text>
  <text x="575" y="176" text-anchor="middle" class="sub">Calibration · Exposure</text>
  <text x="575" y="192" text-anchor="middle" class="sub" font-style="italic">per-segment SHAP shift</text>

  <rect class="box" x="700" y="108" width="190" height="104"/>
  <text x="795" y="130" text-anchor="middle" class="title">4. Jaccard Dedup</text>
  <text x="795" y="150" text-anchor="middle" class="sub">drop candidate if overlap</text>
  <text x="795" y="163" text-anchor="middle" class="sub">≥ 0.70 with one already kept</text>
  <text x="795" y="182" text-anchor="middle" class="sub" font-style="italic">(same rule, all 5 techniques)</text>

  <rect class="box" x="920" y="108" width="190" height="104"/>
  <text x="1015" y="130" text-anchor="middle" class="title">5. Scoring</text>
  <text x="1015" y="150" text-anchor="middle" class="sub">SIS · DIS · Root Cause Score</text>
  <text x="1015" y="169" text-anchor="middle" class="sub" font-weight="700">Severity Score</text>
  <text x="1015" y="184" text-anchor="middle" class="sub" font-style="italic">(scale set by this technique)</text>

  <rect class="box" x="1140" y="108" width="190" height="104"/>
  <text x="1235" y="130" text-anchor="middle" class="title">6. Technique Top-N</text>
  <text x="1235" y="150" text-anchor="middle" class="sub">ranked by Severity Score</text>
  <text x="1235" y="163" text-anchor="middle" class="sub">within this technique only</text>

  <path class="edge" d="M230,160 L258,160"/>
  <path class="edge" d="M450,160 L478,160"/>
  <path class="edge" d="M670,160 L698,160"/>
  <path class="edge" d="M890,160 L918,160"/>
  <path class="edge" d="M1110,160 L1138,160"/>

  <!-- Fan-in to Band B -->
  <path class="edge" d="M1235,212 L1235,270 L565,270 L565,338"/>
  <text x="850" y="263" text-anchor="middle" class="edgelabel">×5 — one Top-N list per technique, not yet comparable to each other</text>

  <!-- Band B -->
  <rect class="box" x="480" y="340" width="210" height="90"/>
  <text x="585" y="364" text-anchor="middle" class="title">Cross-Technique Pool</text>
  <text x="585" y="384" text-anchor="middle" class="sub">≤ 50 candidates</text>
  <text x="585" y="398" text-anchor="middle" class="sub">(10 × 5 techniques)</text>
  <text x="585" y="413" text-anchor="middle" class="sub" font-style="italic">dedup: merge same population</text>

  <path class="edge" d="M690,385 L718,385"/>

  <rect class="box" x="720" y="340" width="230" height="90"/>
  <text x="835" y="364" text-anchor="middle" class="title">Normalize Root Cause Score</text>
  <text x="835" y="384" text-anchor="middle" class="sub">min–max across the whole pool</text>
  <text x="835" y="398" text-anchor="middle" class="sub">(same formula, every technique)</text>

  <path class="edge" d="M950,385 L978,385"/>

  <rect class="accent" x="980" y="340" width="210" height="90"/>
  <text x="1085" y="364" text-anchor="middle" class="titleAccent">Top 10 Root Causes</text>
  <text x="1085" y="384" text-anchor="middle" class="sub">ranked by</text>
  <text x="1085" y="398" text-anchor="middle" class="sub">Normalized Root Cause Score</text>

  <path class="edge" d="M1190,385 L1218,385"/>

  <rect class="accent" x="1220" y="340" width="230" height="90"/>
  <text x="1335" y="364" text-anchor="middle" class="titleAccent">Executive Summary</text>
  <text x="1335" y="384" text-anchor="middle" class="sub">heatmap · bubble · waterfall</text>
  <text x="1335" y="398" text-anchor="middle" class="sub">AI narrative (Streamlit)</text>

  <!-- Callout: why not Severity Score -->
  <path d="M835,430 L835,455" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <rect class="warn" x="590" y="458" width="490" height="70"/>
  <text x="835" y="478" text-anchor="middle" class="warnText" font-weight="700">Why not rank this step by Severity Score?</text>
  <text x="835" y="495" text-anchor="middle" class="warnText">Feature Binning's Severity Score is ~0–1; the other four techniques' is ~0–20.</text>
  <text x="835" y="510" text-anchor="middle" class="warnText">Root Cause Score uses one formula and comparable inputs for all 5 — it's the only fair ranking key here.</text>
</svg>
