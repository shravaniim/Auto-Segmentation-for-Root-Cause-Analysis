<svg viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Development and monitoring data feed a single decision: run trend analysis or not. No runs all five segmentation techniques once against one monitoring snapshot. Yes runs the same five techniques once per month and additionally flags segments that keep recurring. Both paths then join the same scoring, ranking, and results pipeline.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <style>
    .box { fill:#f8fafc; stroke:#334155; stroke-width:1.5; rx:10; }
    .accent { fill:#ecfdf5; stroke:#16a34a; stroke-width:2; rx:10; }
    .decision { fill:#eff6ff; stroke:#2563eb; stroke-width:2; }
    .title { font-family:Arial,Helvetica,sans-serif; font-size:15px; font-weight:700; fill:#0f172a; }
    .titleAccent { font-family:Arial,Helvetica,sans-serif; font-size:15px; font-weight:700; fill:#14532d; }
    .titleDecision { font-family:Arial,Helvetica,sans-serif; font-size:14px; font-weight:700; fill:#1e3a8a; }
    .sub { font-family:Arial,Helvetica,sans-serif; font-size:12px; fill:#334155; }
    .edge { stroke:#334155; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    .edgelabel { font-family:Arial,Helvetica,sans-serif; font-size:12px; font-weight:700; fill:#334155; }
    .h1 { font-family:Arial,Helvetica,sans-serif; font-size:21px; font-weight:700; fill:#0f172a; }
    .h2 { font-family:Arial,Helvetica,sans-serif; font-size:13px; fill:#475569; }
  </style>

  <text x="450" y="30" text-anchor="middle" class="h1">Auto-Segmentation — High-Level Flow</text>
  <text x="450" y="50" text-anchor="middle" class="h2">One pipeline, two modes — a single monitoring snapshot, or a trend across several months.</text>

  <!-- Box 1: Data -->
  <rect class="box" x="300" y="70" width="300" height="64"/>
  <text x="450" y="96" text-anchor="middle" class="title">Development + Monitoring Data</text>
  <text x="450" y="116" text-anchor="middle" class="sub">Built-in demo dataset, or your own upload</text>

  <path class="edge" d="M450,134 L450,160"/>

  <!-- Decision diamond -->
  <polygon class="decision" points="320,215 450,158 580,215 450,272"/>
  <text x="450" y="211" text-anchor="middle" class="titleDecision">Run Trend Analysis?</text>
  <text x="450" y="228" text-anchor="middle" class="sub">Tab 2 toggle</text>

  <path class="edge" d="M320,215 L235,320"/>
  <text x="245" y="270" class="edgelabel">No</text>

  <path class="edge" d="M580,215 L665,320"/>
  <text x="620" y="270" class="edgelabel">Yes</text>

  <!-- Branch: No -->
  <rect class="box" x="60" y="322" width="340" height="92"/>
  <text x="230" y="348" text-anchor="middle" class="title">Single-Month Analysis</text>
  <text x="230" y="370" text-anchor="middle" class="sub">Run all 5 techniques once against</text>
  <text x="230" y="388" text-anchor="middle" class="sub">one monitoring snapshot</text>

  <!-- Branch: Yes -->
  <rect class="box" x="500" y="322" width="340" height="92"/>
  <text x="670" y="348" text-anchor="middle" class="title">Multi-Month Trend Analysis</text>
  <text x="670" y="370" text-anchor="middle" class="sub">Run the same 5 techniques once per month,</text>
  <text x="670" y="388" text-anchor="middle" class="sub">then flag segments that keep recurring</text>

  <!-- Converge -->
  <path class="edge" d="M230,414 L230,440 L440,440 L440,462"/>
  <path class="edge" d="M670,414 L670,440 L460,440 L460,462"/>

  <!-- Box: Rank & Score -->
  <rect class="box" x="270" y="464" width="360" height="80"/>
  <text x="450" y="492" text-anchor="middle" class="title">Score &amp; Rank Every Segment</text>
  <text x="450" y="513" text-anchor="middle" class="sub">Same formulas for every technique — merged into one ranked list</text>

  <path class="edge" d="M450,544 L450,570"/>

  <!-- Box: Results -->
  <rect class="accent" x="240" y="572" width="420" height="106"/>
  <text x="450" y="600" text-anchor="middle" class="titleAccent">📊 Results</text>
  <text x="450" y="623" text-anchor="middle" class="sub">Ranked segments, charts, executive summary</text>
  <text x="450" y="642" text-anchor="middle" class="sub">Early-warning forecast (trend mode) · Q&amp;A assistant</text>
</svg>
